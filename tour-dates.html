<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e6e6e6">
  <title>Tour Dates - swordes.world</title>
  <link rel="icon" href="images/favicon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="topbar"></header>

  <main class="page">
    <a class="logo" href="index.html"><img src="images/swordes-logo.png" alt="swordes - back to home page"></a>

    <section class="window">
      <h2 class="window-title"><img src="images/globe-icon.png" alt="">Swordes Tour 2026</h2>
      <div class="window-body">
        <div class="tour-body">
          <img src="images/admit-one.gif" alt="">
          <div class="button-stack big">
            <a class="button" href="https://www.brickandmortarmusic.com/tm-event/blue-light-with-sassy-009/" target="_blank" rel="noopener">San Francisco 11/4</a>
            <a class="button" href="https://ra.co/events/2517064" target="_blank" rel="noopener">San Francisco (DJ set) 11/6</a>
            <a class="button" href="https://www.ticketmaster.com/event/090064EF38880D79" target="_blank" rel="noopener">Los Angeles 11/11</a>
          </div>
        </div>

        <!-- Email sign-up: sends visitors to Buttondown to confirm -->
        <p class="notify-text">
          Don&rsquo;t see ur city?<br>
          Enter ur email to be notified when new dates are announced.
        </p>
        <form class="signup" action="https://buttondown.com/api/emails/embed-subscribe/swordes" method="post">
          <input type="email" name="email" placeholder="Email" aria-label="Email" required>
          <button class="button" type="submit">Notify Me &lt;3</button>
        </form>
      </div>
    </section>

    <img class="music-gif" src="images/music.gif" alt="">
  </main>

  <script src="script.js"></script>
</body>
</html>
